[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "protect-context"
version = "1.0.0"
description = "protect-context agent guardrail suite: shared store, MCP server (fastmcp), CLI"
requires-python = ">=3.10"
dependencies = ["fastmcp>=3,<4"]

[project.optional-dependencies]
dev = ["pytest"]

[project.scripts]
protect-context = "protect_context.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
